<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Parchment base gradient -->
    <radialGradient id="parchment-base" cx="45%" cy="38%" r="65%">
      <stop offset="0%"   stop-color="#e8d5a3"/>
      <stop offset="40%"  stop-color="#d4b87a"/>
      <stop offset="75%"  stop-color="#c4a05a"/>
      <stop offset="100%" stop-color="#a07840"/>
    </radialGradient>

    <!-- Water fill -->
    <linearGradient id="water-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8ab4c4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6090a8" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Mountain hatch pattern -->
    <pattern id="mountain-hatch" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 4 L2 0 L4 4" fill="none" stroke="#6b4c28" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <!-- Forest dot pattern -->
    <pattern id="forest-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3"  cy="3"  r="2.5" fill="#5a7a3a" fill-opacity="0.35"/>
      <circle cx="9"  cy="7"  r="2"   fill="#4a6a2a" fill-opacity="0.3"/>
      <circle cx="6"  cy="10" r="1.8" fill="#5a7a3a" fill-opacity="0.25"/>
    </pattern>

    <!-- Plains subtle grain -->
    <pattern id="plains-grain" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#8a6a30" stroke-width="0.3" stroke-opacity="0.2"/>
    </pattern>

    <!-- Ink texture filter -->
    <filter id="ink-rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Soft shadow for terrain -->
    <filter id="terrain-shadow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offset"/>
      <feMerge><feMergeNode in="offset"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Parchment edge burn -->
    <radialGradient id="edge-burn" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="transparent"/>
      <stop offset="100%" stop-color="#3a2010" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Clip to map border -->
    <clipPath id="map-clip">
      <rect x="20" y="20" width="760" height="1060" rx="6"/>
    </clipPath>
  </defs>

  <!-- ══ PARCHMENT BASE ══ -->
  <rect width="800" height="1100" fill="#c8a055"/>
  <rect width="800" height="1100" fill="url(#parchment-base)"/>

  <!-- Aged blotch overlays -->
  <ellipse cx="120" cy="200" rx="180" ry="120" fill="#b89040" fill-opacity="0.25"/>
  <ellipse cx="650" cy="800" rx="200" ry="160" fill="#a07830" fill-opacity="0.2"/>
  <ellipse cx="400" cy="550" rx="300" ry="200" fill="#d4b870" fill-opacity="0.15"/>
  <ellipse cx="100" cy="900" rx="140" ry="100" fill="#8a6030" fill-opacity="0.2"/>
  <ellipse cx="700" cy="150" rx="120" ry="90"  fill="#c0a060" fill-opacity="0.2"/>

  <g clip-path="url(#map-clip)">

    <!-- ══ OCEAN / SEA (left + bottom-right) ══ -->
    <!-- Western sea -->
    <path d="
      M 20 20
      L 20 1080
      Q 80 1060 110 980
      Q 130 920 105 850
      Q 85 790 100 720
      Q 115 660 90 590
      Q 70 530 95 460
      Q 115 400 85 330
      Q 60 270 90 200
      Q 110 150 80 90
      Q 55 50 20 20 Z
    " fill="url(#water-fill)" filter="url(#ink-rough)"/>

    <!-- Northern sea inlet -->
    <path d="
      M 300 20 L 760 20 L 760 80
      Q 680 90 600 70
      Q 520 55 450 85
      Q 390 100 340 80
      Q 315 65 300 20 Z
    " fill="url(#water-fill)" filter="url(#ink-rough)"/>

    <!-- Central river/estuary system -->
    <path d="
      M 420 260
      Q 460 290 490 330
      Q 530 380 510 430
      Q 495 465 520 490
      Q 545 510 535 545
      Q 525 570 500 580
      Q 475 590 460 575
      Q 440 558 415 565
      Q 390 572 380 555
      Q 365 535 375 510
      Q 385 488 365 472
      Q 345 456 350 430
      Q 355 405 380 390
      Q 405 374 400 345
      Q 395 318 420 295 Z
    " fill="url(#water-fill)" filter="url(#ink-rough)" opacity="0.8"/>

    <!-- Small lake (east) -->
    <ellipse cx="620" cy="420" rx="45" ry="30" fill="url(#water-fill)" opacity="0.75" filter="url(#ink-rough)"/>

    <!-- ══ MAIN LANDMASS ══ -->
    <path d="
      M 100 20
      Q 160 35 220 28
      Q 280 20 300 20
      Q 315 65 340 80
      Q 390 100 450 85
      Q 520 55 600 70
      Q 680 90 760 80
      L 760 1080
      Q 700 1075 630 1068
      Q 560 1060 490 1072
      Q 420 1080 350 1070
      Q 280 1060 210 1075
      Q 150 1085 110 1080
      Q 80 1060 105 980
      Q 130 920 108 860
      Q 90 800 102 730
      Q 114 665 92 598
      Q 75 540 96 468
      Q 114 405 88 338
      Q 65 275 92 205
      Q 112 152 82 92
      Q 60 55 100 20 Z
    " fill="#c8a860" fill-opacity="0.5"/>

    <!-- ══ PLAINS TEXTURE (main land areas) ══ -->
    <path d="
      M 110 100 Q 300 80 500 110 Q 650 130 750 115
      L 750 450 Q 630 460 550 445 Q 430 425 370 440
      Q 340 450 360 475 Q 380 500 370 525
      Q 355 548 380 565 Q 415 580 460 575
      Q 495 570 520 590 Q 545 610 530 650
      L 530 750 Q 650 740 750 755 L 750 900
      Q 650 910 550 895 Q 450 878 350 890
      Q 250 900 160 880 Q 120 868 110 840
      Q 90 780 105 720 Q 118 665 95 600
      Q 78 548 98 478 Q 115 415 88 345
      Q 68 282 95 215 Q 112 158 100 100 Z
    " fill="url(#plains-grain)"/>

    <!-- ══ MOUNTAIN RANGES ══ -->
    <!-- Northern spine range -->
    <g filter="url(#terrain-shadow)" opacity="0.85">
      <!-- Peak cluster 1 -->
      <path d="M 170 130 L 185 95 L 200 130 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 190 135 L 210 88 L 228 135 Z" fill="#9a7838" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 220 138 L 235 100 L 250 138 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 245 132 L 262 92 L 278 132 Z" fill="#a08040" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 268 136 L 280 105 L 294 136 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>
      <!-- Hatch overlay -->
      <path d="M 160 140 Q 230 100 300 140" fill="none" stroke="#6b4c28" stroke-width="0.4" stroke-opacity="0.4" stroke-dasharray="2 3"/>

      <!-- Peak cluster 2 (mid-left spine) -->
      <path d="M 120 340 L 138 300 L 155 340 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 142 345 L 162 298 L 180 345 Z" fill="#9a7838" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 168 342 L 185 305 L 202 342 Z" fill="#a08040" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 195 340 L 210 308 L 225 340 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>

      <!-- Peak cluster 3 (lower spine) -->
      <path d="M 130 560 L 148 522 L 165 560 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 155 555 L 175 510 L 194 555 Z" fill="#9a7838" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 183 558 L 200 520 L 217 558 Z" fill="#a08040" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 210 555 L 225 525 L 240 555 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 232 560 L 245 530 L 258 560 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>

      <!-- Peak cluster 4 (far south) -->
      <path d="M 200 820 L 218 782 L 235 820 Z" fill="#8a6830" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 228 818 L 248 775 L 268 818 Z" fill="#9a7838" stroke="#5a3810" stroke-width="0.8"/>
      <path d="M 260 822 L 278 784 L 296 822 Z" fill="#a08040" stroke="#5a3810" stroke-width="0.8"/>
    </g>

    <!-- ══ FOREST REGIONS ══ -->
    <!-- Northern forests -->
    <ellipse cx="420" cy="160" rx="90" ry="55" fill="url(#forest-dots)"/>
    <ellipse cx="380" cy="180" rx="65" ry="40" fill="#5a7a3a" fill-opacity="0.12"/>
    <!-- Individual trees (north) -->
    <g fill="#4a6a28" fill-opacity="0.6">
      <circle cx="370" cy="148" r="8"/><circle cx="388" cy="138" r="10"/><circle cx="408" cy="142" r="9"/>
      <circle cx="428" cy="135" r="11"/><circle cx="448" cy="145" r="8"/><circle cx="462" cy="155" r="9"/>
      <circle cx="440" cy="165" r="10"/><circle cx="418" cy="170" r="8"/><circle cx="395" cy="168" r="9"/>
      <circle cx="375" cy="162" r="7"/>
    </g>
    <g fill="#3a5a20" fill-opacity="0.4">
      <circle cx="370" cy="148" r="5"/><circle cx="388" cy="138" r="6"/><circle cx="428" cy="135" r="7"/>
      <circle cx="462" cy="155" r="5"/>
    </g>

    <!-- Eastern forests -->
    <ellipse cx="650" cy="280" rx="80" ry="60" fill="url(#forest-dots)"/>
    <g fill="#4a6a28" fill-opacity="0.55">
      <circle cx="610" cy="265" r="9"/><circle cx="630" cy="252" r="11"/><circle cx="652" cy="258" r="10"/>
      <circle cx="670" cy="265" r="9"/><circle cx="685" cy="278" r="8"/><circle cx="672" cy="292" r="10"/>
      <circle cx="650" cy="298" r="9"/><circle cx="628" cy="290" r="8"/><circle cx="612" cy="280" r="7"/>
    </g>

    <!-- Southern forests (Cirnay borderlands) -->
    <ellipse cx="580" cy="720" rx="70" ry="45" fill="url(#forest-dots)"/>
    <g fill="#4a6a28" fill-opacity="0.5">
      <circle cx="545" cy="710" r="8"/><circle cx="562" cy="700" r="10"/><circle cx="582" cy="705" r="9"/>
      <circle cx="600" cy="712" r="8"/><circle cx="612" cy="724" r="9"/><circle cx="598" cy="735" r="8"/>
      <circle cx="578" cy="732" r="7"/><circle cx="558" cy="726" r="8"/>
    </g>

    <!-- ══ RIVER SYSTEM ══ -->
    <!-- Main river from north to estuary -->
    <path d="
      M 400 80
      Q 415 120 408 160
      Q 400 200 412 240
      Q 422 268 418 295
      Q 414 318 420 260
    " fill="none" stroke="#7aabcc" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round"/>
    <!-- River continues south from estuary -->
    <path d="
      M 460 575
      Q 448 605 452 635
      Q 456 665 440 690
      Q 424 715 430 745
      Q 436 772 420 800
    " fill="none" stroke="#7aabcc" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>
    <!-- Tributary (east) -->
    <path d="
      M 560 490
      Q 545 505 525 490
      Q 510 478 510 430
    " fill="none" stroke="#7aabcc" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- ══ ROADS (faint, suggesting travel routes) ══ -->
    <g stroke="#8a6030" stroke-opacity="0.25" stroke-width="1" fill="none" stroke-dasharray="4 5">
      <!-- North-south road -->
      <path d="M 340 100 Q 355 200 350 300 Q 345 400 360 500 Q 370 580 360 680 Q 350 780 370 880 Q 380 950 360 1040"/>
      <!-- East road -->
      <path d="M 350 300 Q 430 285 520 295 Q 600 305 680 290"/>
      <!-- Southern route -->
      <path d="M 360 680 Q 450 665 540 670 Q 620 675 700 660"/>
    </g>

    <!-- ══ WATER DETAILS ══ -->
    <!-- Wave marks on western sea -->
    <g stroke="#5888a8" stroke-width="0.8" fill="none" stroke-opacity="0.4">
      <path d="M 30 150 Q 40 144 50 150 Q 60 156 70 150"/>
      <path d="M 25 180 Q 35 174 45 180 Q 55 186 65 180"/>
      <path d="M 32 220 Q 42 214 52 220 Q 62 226 72 220"/>
      <path d="M 28 280 Q 38 274 48 280 Q 58 286 68 280"/>
      <path d="M 22 350 Q 32 344 42 350 Q 52 356 62 350"/>
      <path d="M 30 420 Q 40 414 50 420 Q 60 426 70 420"/>
      <path d="M 25 500 Q 35 494 45 500 Q 55 506 65 500"/>
      <path d="M 30 580 Q 40 574 50 580 Q 60 586 70 580"/>
      <path d="M 28 660 Q 38 654 48 660 Q 58 666 68 660"/>
      <path d="M 22 750 Q 32 744 42 750 Q 52 756 62 750"/>
    </g>
    <!-- Wave marks on northern sea -->
    <g stroke="#5888a8" stroke-width="0.8" fill="none" stroke-opacity="0.35">
      <path d="M 420 35 Q 430 29 440 35 Q 450 41 460 35"/>
      <path d="M 540 42 Q 550 36 560 42 Q 570 48 580 42"/>
      <path d="M 640 30 Q 650 24 660 30 Q 670 36 680 30"/>
    </g>
    <!-- Estuary waves -->
    <g stroke="#5888a8" stroke-width="0.7" fill="none" stroke-opacity="0.35">
      <path d="M 430 370 Q 438 365 446 370 Q 454 375 462 370"/>
      <path d="M 440 410 Q 448 405 456 410 Q 464 415 472 410"/>
      <path d="M 425 450 Q 433 445 441 450 Q 449 455 457 450"/>
    </g>

    <!-- ══ SETTLEMENT MARKERS ══ -->
    <!-- These mark the general quest regions as named places -->
    <!-- Northern settlement -->
    <g transform="translate(338, 165)" opacity="0.65">
      <rect x="-6" y="-6" width="12" height="10" fill="#c8a055" stroke="#5a3810" stroke-width="0.8"/>
      <rect x="-4" y="-10" width="8" height="5" fill="#8a4820" stroke="#5a3810" stroke-width="0.6"/>
      <line x1="-8" y1="4" x2="8" y2="4" stroke="#5a3810" stroke-width="0.5"/>
    </g>

    <!-- River crossing settlement -->
    <g transform="translate(308, 400)" opacity="0.65">
      <rect x="-5" y="-5" width="10" height="9" fill="#c8a055" stroke="#5a3810" stroke-width="0.8"/>
      <rect x="-3" y="-9" width="6" height="5" fill="#8a4820" stroke="#5a3810" stroke-width="0.6"/>
    </g>

    <!-- Eastern highlands settlement -->
    <g transform="translate(588, 440)" opacity="0.6">
      <rect x="-5" y="-5" width="10" height="9" fill="#c8a055" stroke="#5a3810" stroke-width="0.8"/>
      <rect x="-3" y="-9" width="6" height="5" fill="#8a4820" stroke="#5a3810" stroke-width="0.6"/>
    </g>

    <!-- Southern settlement -->
    <g transform="translate(340, 680)" opacity="0.6">
      <rect x="-6" y="-6" width="12" height="10" fill="#c8a055" stroke="#5a3810" stroke-width="0.8"/>
      <rect x="-4" y="-10" width="8" height="5" fill="#8a4820" stroke="#5a3810" stroke-width="0.6"/>
      <line x1="-8" y1="4" x2="8" y2="4" stroke="#5a3810" stroke-width="0.5"/>
    </g>

    <!-- ══ DECORATIVE TEXT LABELS ══ -->
    <g font-family="Georgia, serif" fill="#4a3018" fill-opacity="0.5">
      <!-- Sea names -->
      <text x="44" y="480" font-size="11" font-style="italic" transform="rotate(-90, 44, 480)">The Wandering Sea</text>
      <text x="500" y="48" font-size="10" font-style="italic" text-anchor="middle">Northern Reaches</text>

      <!-- Region names -->
      <text x="440" y="420" font-size="13" font-style="italic" text-anchor="middle" fill-opacity="0.35">The Confluence</text>
      <text x="630" y="650" font-size="16" font-style="italic" text-anchor="middle" fill-opacity="0.4">Cirnay</text>
      <text x="400" y="950" font-size="14" font-style="italic" text-anchor="middle" fill-opacity="0.35">The Deep South</text>
      <text x="220" y="240" font-size="11" font-style="italic" fill-opacity="0.4">The Spine</text>
    </g>

    <!-- ══ BORDER ══ -->
    <!-- Inner decorative border -->
    <rect x="28" y="28" width="744" height="1044" fill="none"
          stroke="#5a3810" stroke-width="1.5" stroke-opacity="0.5" rx="4"/>
    <rect x="32" y="32" width="736" height="1036" fill="none"
          stroke="#5a3810" stroke-width="0.5" stroke-opacity="0.3" rx="3"/>

    <!-- Corner ornaments -->
    <g stroke="#5a3810" stroke-opacity="0.5" fill="none" stroke-width="1">
      <path d="M 28 28 L 55 28 M 28 28 L 28 55"/>
      <path d="M 772 28 L 745 28 M 772 28 L 772 55"/>
      <path d="M 28 1072 L 55 1072 M 28 1072 L 28 1045"/>
      <path d="M 772 1072 L 745 1072 M 772 1072 L 772 1045"/>
    </g>

  </g><!-- end clip -->

  <!-- ══ EDGE BURN / VIGNETTE ══ -->
  <rect width="800" height="1100" fill="url(#edge-burn)"/>

  <!-- Torn/aged edges -->
  <path d="M 0 0 Q 8 12 0 25 Q -3 40 5 55 Q 12 70 3 85 Q -2 100 6 115 Q 14 130 2 145 Q -4 160 4 175 L 0 1100 L 0 0 Z"
        fill="#b08040" fill-opacity="0.4"/>
  <path d="M 800 0 Q 792 15 800 30 Q 805 45 797 60 Q 790 75 800 90 Q 808 105 798 120 L 800 1100 L 800 0 Z"
        fill="#b08040" fill-opacity="0.3"/>

</svg>
